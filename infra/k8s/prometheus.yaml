apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/
          ports:
            - containerPort: 9090
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    scrape_configs:
      - job_name: 'spring-app'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['app:8080']

      - job_name: 'sandbox-candidates'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['sandbox-runner:9091']

      - job_name: 'evaluator'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['evaluator:5001']

      - job_name: 'generator'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['generator:5002']

      - job_name: 'orchestrator'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['orchestrator:5003']
---

