apiVersion: v1
kind: Namespace
metadata:
  name: codigo-vivo

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: codigo-vivo-env
  namespace: codigo-vivo
data:
  APP_ENV: "production"
  PROMETHEUS_URL: "http://prometheus:9090"
  ORCHESTRATOR_URL: "http://orchestrator:5003"
  DETECTOR_CHECK_INTERVAL: "30"
  LOG_LEVEL: "INFO"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  namespace: codigo-vivo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codigo-vivo-app
  namespace: codigo-vivo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: codigo-vivo-app
  template:
    metadata:
      labels:
        app: codigo-vivo-app
    spec:
      containers:
      - name: app
        image: codigo-vivo/app:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: codigo-vivo-env
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: codigo-vivo-app
  namespace: codigo-vivo
spec:
  type: LoadBalancer
  selector:
    app: codigo-vivo-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: detector
  namespace: codigo-vivo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: detector
  template:
    metadata:
      labels:
        app: detector
    spec:
      containers:
      - name: detector
        image: codigo-vivo/detector:latest
        ports:
        - containerPort: 5004
        envFrom:
        - configMapRef:
            name: codigo-vivo-env
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: detector
  namespace: codigo-vivo
spec:
  selector:
    app: detector
  ports:
  - protocol: TCP
    port: 5004
    targetPort: 5004

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: generator
  namespace: codigo-vivo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: generator
  template:
    metadata:
      labels:
        app: generator
    spec:
      containers:
      - name: generator
        image: codigo-vivo/generator:latest
        ports:
        - containerPort: 5002
        envFrom:
        - configMapRef:
            name: codigo-vivo-env
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"

---
apiVersion: v1
kind: Service
metadata:
  name: generator
  namespace: codigo-vivo
spec:
  selector:
    app: generator
  ports:
  - protocol: TCP
    port: 5002
    targetPort: 5002

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluator
  namespace: codigo-vivo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: evaluator
  template:
    metadata:
      labels:
        app: evaluator
    spec:
      containers:
      - name: evaluator
        image: codigo-vivo/evaluator:latest
        ports:
        - containerPort: 5001
        envFrom:
        - configMapRef:
            name: codigo-vivo-env
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: evaluator
  namespace: codigo-vivo
spec:
  selector:
    app: evaluator
  ports:
  - protocol: TCP
    port: 5001
    targetPort: 5001

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: codigo-vivo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
      - name: orchestrator
        image: codigo-vivo/orchestrator:latest
        ports:
        - containerPort: 5003
        envFrom:
        - configMapRef:
            name: codigo-vivo-env
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: codigo-vivo
spec:
  selector:
    app: orchestrator
  ports:
  - protocol: TCP
    port: 5003
    targetPort: 5003

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: generator-hpa
  namespace: codigo-vivo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: generator
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: evaluator-hpa
  namespace: codigo-vivo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: evaluator
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
