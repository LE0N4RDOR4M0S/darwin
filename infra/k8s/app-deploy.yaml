apiVersion: apps/v1
kind: Deployment
metadata:
  name: codigo-vivo-app
  labels:
    app: codigo-vivo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: codigo-vivo
  template:
    metadata:
      labels:
        app: codigo-vivo
    spec:
      containers:
        - name: app
          image: codigo-vivo/app:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: codigo-vivo-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: codigo-vivo-app
spec:
  selector:
    app: codigo-vivo
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
