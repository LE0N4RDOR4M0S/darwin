global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'spring-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['app:8080']

  - job_name: 'sandbox-candidates'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['sandbox-runner:9091']

  - job_name: 'evaluator'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['evaluator:5001']

  - job_name: 'generator'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['generator:5002']

  - job_name: 'orchestrator'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['orchestrator:5003']
