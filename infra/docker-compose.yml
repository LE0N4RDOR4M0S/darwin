
services:
  app:
    build: ../app
    container_name: codigo-vivo-app
    ports:
      - "8080:8080"
    environment:
      - MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED=true
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=prometheus,health,info
    networks:
      - codigo-vivo-net

  prometheus:
    image: prom/prometheus:latest
    container_name: codigo-vivo-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - codigo-vivo-net

  grafana:
    image: grafana/grafana:latest
    container_name: codigo-vivo-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - codigo-vivo-net

  generator:
    build: ../generator
    container_name: codigo-vivo-generator
    ports:
      - "5000:5000"
    volumes:
      - ../:/repo
      - ./secrets/ssh_id_rsa:/root/.ssh/id_rsa:ro
    working_dir: /app
    environment:
      - SSH_KEY_PATH=/root/.ssh/id_rsa
    networks:
      - codigo-vivo-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/docs || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s

  evaluator:
    build: ../evaluator
    container_name: codigo-vivo-evaluator
    ports:
      - "5001:5001"
    networks:
      - codigo-vivo-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/docs || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s

  orchestrator:
    build: ../orchestrator
    container_name: codigo-vivo-orchestrator
    ports:
      - "5002:5002"
    depends_on:
      generator:
        condition: service_healthy
      evaluator:
        condition: service_healthy
    environment:
      - GENERATOR_URL=http://generator:5000/generate
      - EVALUATOR_URL=http://evaluator:5001/evaluate
    networks:
      - codigo-vivo-net

networks:
  codigo-vivo-net:
    driver: bridge
